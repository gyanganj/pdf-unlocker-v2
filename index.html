<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>PDF Secure Unlock</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.css" />
    <style>
        /* Custom UI Styling to override default Streamlit look */
        :root {
            --primary-color: #6366f1;
        }
        .stApp {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        /* Style the upload box */
        [data-testid="stFileUploader"] {
            border: 2px dashed var(--primary-color);
            border-radius: 15px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.5);
        }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.js"></script>
    <script>
      stlite.mount({
        requirements: ["pypdf"],
        entrypoint: "app.py",
        files: {
          "app.py": `
import streamlit as st
from pypdf import PdfReader, PdfWriter
import io
import time

# UI Header
st.set_page_config(page_title="PDF Secure", page_icon="🛡️")

# Custom CSS for the "Attractive" look
st.markdown("""
    <style>
    .main { text-align: center; }
    .stButton>button {
        width: 100%;
        border-radius: 20px;
        height: 3em;
        background-color: #6366f1;
        color: white;
        font-weight: bold;
        border: none;
    }
    .stButton>button:hover {
        background-color: #4f46e5;
        border: none;
        color: white;
    }
    </style>
    """, unsafe_allow_html=True)

st.title("🛡️ PDF Secure Unlock")
st.markdown("#### The world's most private PDF tool.")
st.caption("Your files never leave your browser. Processing is 100% local.")

# Main Layout Card
with st.container():
    st.write("---")
    
    # File Upload with nice icon
    uploaded_file = st.file_uploader("📂 Drop your locked PDF here", type="pdf")
    
    col1, col2 = st.columns([2,1])
    with col1:
        password = st.text_input("🔑 Enter Password", type="password", placeholder="Type file password...")
    
    with col2:
        st.write("##") # Spacing
        process_btn = st.button("Unlock Now")

if uploaded_file and password and process_btn:
    with st.status("Processing Securely...", expanded=True) as status:
        try:
            st.write("Reading PDF structure...")
            reader = PdfReader(uploaded_file)
            
            if reader.is_encrypted:
                st.write("Decrypting local data...")
                if reader.decrypt(password):
                    writer = PdfWriter()
                    for page in reader.pages:
                        writer.add_page(page)
                    
                    out = io.BytesIO()
                    writer.write(out)
                    
                    status.update(label="✅ Unlock Complete!", state="complete", expanded=False)
                    
                    st.balloons()
                    st.success("Your file is ready!")
                    st.download_button(
                        label="📥 Download Unlocked PDF",
                        data=out.getvalue(),
                        file_name=f"unlocked_{uploaded_file.name}",
                        mime="application/pdf",
                        use_container_width=True
                    )
                else:
                    status.update(label="❌ Failed", state="error")
                    st.error("Incorrect password. Please try again.")
            else:
                status.update(label="💡 Already Unlocked", state="complete")
                st.info("This PDF has no password protection.")
                
        except Exception as e:
            st.error(f"An unexpected error occurred: {e}")

st.write("---")
st.markdown("<p style='text-align: center; color: grey;'>Made with ❤️ for Privacy</p>", unsafe_allow_html=True)
`,
        },
      }, document.getElementById("root"));
    </script>
  </body>
</html>
